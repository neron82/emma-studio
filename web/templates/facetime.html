<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emma Facetime</title>
<style>
  :root { --bg:#0b0d10; --card:#161a20; --accent:#e8a0bf; --text:#e6e9ee; --dim:#8a93a3; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; margin:0;
         height:100vh; display:flex; flex-direction:column; }
  header { padding:.8rem 1.2rem; border-bottom:1px solid #20262e; display:flex; align-items:center; gap:.8rem;}
  header h1 { font-size:1rem; font-weight:600; margin:0;} header span{color:var(--accent);}
  #stage { flex:1; position:relative; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  .panel { position:absolute; bottom:0; left:0; right:0; padding:1rem;
           background:linear-gradient(transparent, rgba(11,13,16,.9) 40%); }
  .row { display:flex; gap:.6rem; max-width:760px; margin:0 auto; }
  input,button { font:inherit; border-radius:10px; border:1px solid #2c333d;
    background:#12161b; color:var(--text); padding:.65rem .9rem; }
  input { flex:1; }
  button { background:var(--accent); color:#141018; font-weight:600; cursor:pointer; border:none; }
  #micBtn { background:#232b35; color:var(--text); width:52px; }
  #status { text-align:center; color:var(--dim); font-size:.85rem; min-height:1.4em; margin-top:.5rem;}
  #fallback { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
              flex-direction:column; gap:1rem; color:var(--dim); }
  #fallback img { width:min(60vw,340px); border-radius:18px; box-shadow:0 8px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>
<header><h1>Emma <span>Facetime</span></h1><span id="engine" style="color:var(--dim);font-size:.85rem"></span></header>
<div id="stage">
  <div id="fallback">
    <img id="portrait" src="/api/personas/portrait" alt="">
    <div>Avatar-Engine lädt… (Fallback: Standbild)</div>
  </div>
  <canvas id="vrmCanvas"></canvas>
</div>
<div class="panel">
  <div class="row">
    <button id="micBtn" title="Sprich">🎤</button>
    <input id="msg" placeholder="Sag etwas… (Enter)">
    <button id="sendBtn">Senden</button>
  </div>
  <div id="status"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
"three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.min.js"}}
</script>
<script type="module">
const $ = id => document.getElementById(id);
let scene, camera, renderer, vrm = null;
let mouthOpen = 0, targetMouth = 0, blinkTimer = 0, nextBlink = 2;

// --- three.js + VRM setup ----------------------------------------------
async function initAvatar(){
  const THREE = await import('three');
  const { VRMLoaderPlugin } = await import('three-vrm');
  try {
    renderer = new THREE.WebGLRenderer({canvas:$('vrmCanvas'), antialias:true, alpha:true});
    renderer.setSize(innerWidth, innerHeight);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, .1, 20);
    camera.position.set(0, 1.35, 1.2);

    const light = new THREE.DirectionalLight(0xffffff, Math.PI);
    light.position.set(1,2,2); scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, .6));

    // load default VRM model
    const modelUrl = '/static/avatars/default.vrm';
    const head = await fetch(modelUrl, {method:'HEAD'});
    if(!head.ok) throw new Error('no vrm');
    const gltf = await new THREE.GLTFLoader().loadAsync(modelUrl, loader=>{
      loader.register(p=>new VRMLoaderPlugin(p));
    });
    vrm = gltf.userData.vrm;
    scene.add(gltf.scene);
    vrm.scene.traverse(o=>{ o.frustumCulled=false; });
    $('fallback').style.display='none';
    $('engine').textContent='VRM aktiv';
    loop(THREE);
  } catch(e){
    $('engine').textContent='Standbild-Fallback ('+e.message+')';
    animatePortrait();
  }
}

function loop(THREE){
  requestAnimationFrame(()=>loop(THREE));
  if(vrm){
    // lip-sync: smooth toward amplitude target of currently playing audio
    targetMouth = audioLevel()*0.9;
    mouthOpen += (targetMouth-mouthOpen)*0.35;
    vrm.expressionManager?.setValue('aa', mouthOpen);

    // idle blink + subtle sway
    blinkTimer += 1/60;
    if(blinkTimer > nextBlink){ blinkTimer=0; nextBlink=2+Math.random()*3; doBlink(); }
    vrm.expressionManager?.setValue('blink', Math.max(0, 1-Math.abs(blinkTimer-0.12)*12));
    vrm.scene.rotation.y = Math.sin(Date.now()/2400)*0.06;
    vrm.scene.position.y = 1.32 + Math.sin(Date.now()/1900)*0.008;
    vrm.update(1/60);
  }
  renderer.render(scene, camera);
}
function doBlink(){ /* handled in loop via expression curve */ }

// portrait fallback breathing
function animatePortrait(){
  const img=$('portrait'); let t=0;
  setInterval(()=>{ t+=.05; img.style.transform=`scale(${1+Math.sin(t)*0.008})`; },50);
}

// --- audio analysis for lip-sync ---------------------------------------
let audioCtx=null, analyser=null, levelData=null;
window.onChunk = url => { analyser=null; };
function bindAnalyser(el){
  try{
    audioCtx = audioCtx || new AudioContext();
    const src = audioCtx.createMediaElementSource(el);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256; levelData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser); analyser.connect(audioCtx.destination);
  }catch(e){}
}
function audioLevel(){
  if(!analyser || !$('audioOut') || $('audioOut').paused) return 0;
  analyser.getByteFrequencyData(levelData);
  let sum=0; for(let i=2;i<24;i++) sum+=levelData[i];
  return Math.min(1,(sum/22)/140);
}

// --- turn handling ------------------------------------------------------
async function sendTurn(text){
  $('status').textContent='denkt nach…';
  const fd=new FormData();
  fd.append('persona_id','bb8b992fc5b1');
  fd.append('message', text);
  const job=await(await fetch('/api/jobs/turn',{method:'POST',body:fd})).json();
  for(;;){
    const j=await(await fetch('/api/jobs/'+job.id)).json();
    if(j.state==='done'){ speak(j.id, j.script); return; }
    if(j.state==='failed'){ $('status').textContent='Fehler: '+j.error; window.onChunk(null); return; }
    await new Promise(r=>setTimeout(r,1500));
  }
}
async function speak(jobId, text){
  $('status').textContent='';
  const chunks=await(await fetch(`/api/jobs/${jobId}/chunks`)).json();
  const el=$('audioOut')||document.createElement('audio');
  el.id='audioOut'; el.style.display='none'; document.body.appendChild(el);
  if(!el._bound){ bindAnalyser(el); el._bound=true; }
  for(const c of chunks.length?chunks:[`/api/jobs/${jobId}/audio`]){
    await new Promise(res=>{
      el.src=c; window.onChunk(c); el.onended=res; el.play();
    });
  }
  window.onChunk(null);
}

// --- mic (STT via server endpoint) --------------------------------------
$('micBtn').onclick=async()=>{
  $('status').textContent='🎙 Aufnahme…';
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const rec=new MediaRecorder(stream); const parts=[];
  rec.ondataavailable=e=>parts.push(e.data);
  rec.onstop=async()=>{
    $('status').textContent='transkribiere…';
    const fd=new FormData(); fd.append('audio',new Blob(parts,{type:'audio/webm'}));
    const r=await(await fetch('/api/stt',{method:'POST',body:fd})).json();
    if(r.text){ sendTurn(r.text); } else $('status').textContent='(nichts verstanden)';
  };
  rec.start();
  setTimeout(()=>{rec.stop();stream.getTracks().forEach(t=>t.stop());},4000+Math.random()*3000);
};
$('sendBtn').onclick=()=>{ const t=$('msg').value.trim(); if(t){ $('msg').value=''; sendTurn(t);} };
$('msg').addEventListener('keydown',e=>{ if(e.key==='Enter') $('sendBtn').onclick(); });

initAvatar();
</script>
<audio id="audioOut" style="display:none"></audio>
</body>
</html>
