[project]
name = "emma-studio"
version = "0.1.0"
description = "Studio for avatar communication: phone calls, animated-avatar facetime, photoreal video messages."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-telegram-bot>=22",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "openai>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.3",
    "torchaudio>=2.3",
    "faster-whisper>=1.0",
    "onnxruntime>=1.18",
    "nltk>=3.8",
    "rich>=13",
    "moondream>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["studio*"]
